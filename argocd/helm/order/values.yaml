replicaCount: 2

image:
  repository: blackjesusacr.azureacr.io/order
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8003
  targetPort: 8003

config:
  catalogServiceUrl: http://catalog:8001
  customerServiceUrl: http://customer:8002

dbSecretName: mssql-secret

resources:
  requests:
    cpu: "0.2"
    memory: 100Mi
  limits:
    cpu: "0.5"
    memory: 300Mi

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
