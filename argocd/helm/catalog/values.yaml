replicaCount: 2

image:
  repository: blackjesusacr.azurecr.io/catalog
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8001
  targetPort: 8001

dbSecretName: mssql-secret

resources:
  requests:
    cpu: "0.2"
    memory: 100Mi
  limits:
    cpu: "0.5"
    memory: 300Mi

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
