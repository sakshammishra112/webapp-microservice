apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: {{ .Values.saPassword | quote }}
  DATABASE_URL: {{ printf "mssql+pyodbc://sa:%s@%s:%v/%s?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" .Values.saPassword .Release.Name .Values.service.port .Values.database | quote }}
