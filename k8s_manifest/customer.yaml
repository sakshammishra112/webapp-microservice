apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: customer
    spec:
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: customer
          image: app-customer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: db-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "0.2"
              memory: 100Mi
            limits:
              cpu: "0.5"
              memory: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer
spec:
  type: ClusterIP
  selector:
    app: customer
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
