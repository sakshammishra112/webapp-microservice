apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: order
    spec:
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: order
          image: app-order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: db-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "0.2"
              memory: 100Mi
            limits:
              cpu: "0.5"
              memory: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
    - name: http
      port: 8003
      targetPort: 8003
      protocol: TCP
